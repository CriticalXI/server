# Launch starter zones for west_ronfaure.
# Temporary launch-week module: faster trash respawns, loot one TH bracket down, 150 level 1 mobs per zone.
# To end it, remove phoenix/data/launch_starter_zones from modules/init.txt and restart.

templates:

  # -- Custom templates for mobs the core file lacks, scaffolded from the module's mob_groups/mob_pools inserts --

  Tunnel_Worm_Launch:
    id:            4053
    display_name:  Tunnel_Worm
    species:       worm
    roam:          [worm]
    spell_list_id: 9
    skill_list_id: 258
    attributes:
      combat:
        skill: scythe
      jobs: [blm, rdm]
      render:
        look:
          type:  standard
          model: 424
        entity_flags: 129
        hitbox:       11

  Wild_Rabbit_Launch:
    id:            4343
    display_name:  Wild_Rabbit
    species:       rabbit
    skill_list_id: 206
    attributes:
      combat:
        skill: scythe
      jobs: [war, war]
      render:
        look:
          type:  standard
          model: 268
        entity_flags: 129
        hitbox:       11

  Carrion_Worm:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: flint_stone
        - chance: rare
          item: chunk_of_copper_ore
        - chance: very_rare
          item: chunk_of_zinc_ore
        - chance: super_rare
          item: chunk_of_silver_ore
      steal: pebble
      despoil:
        chunk_of_copper_ore: 0
        chunk_of_iron_ore:   0
        chunk_of_silver_ore: 0
        chunk_of_zinc_ore:   0

  Forest_Funguar:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: sleepshroom
      steal: sleepshroom
      despoil:
        woozyshroom:       0
        sleepshroom:       0
        danceshroom:       0
        agaricus_mushroom: 0

  River_Crab:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: chunk_of_rock_salt
        - chance: uncommon
          item: chunk_of_lufet_salt
        - chance: super_rare
          item: slice_of_land_crab_meat
      steal: chunk_of_rock_salt
      despoil:
        slice_of_land_crab_meat: 0
        crab_shell:              0

  Tunnel_Worm:
    attributes:
      spawn:
        respawn: 0 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: flint_stone
      steal: pebble
      despoil:
        chunk_of_copper_ore: 0
        chunk_of_iron_ore:   0
        chunk_of_silver_ore: 0
        chunk_of_zinc_ore:   0

  Wild_Rabbit:
    attributes:
      spawn:
        respawn: 0 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: slice_of_hare_meat
        - chance: rare
          item: rabbit_hide
      steal: san_dorian_carrot
      despoil:
        rabbit_hide:        0
        slice_of_hare_meat: 0

  Wild_Sheep:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: slice_of_giant_sheep_meat
        - chance: very_rare
          item: sheep_tooth
        - chance: rare
          item: sheepskin
      steal: clump_of_sheep_wool
      despoil:
        sheep_tooth: 50

