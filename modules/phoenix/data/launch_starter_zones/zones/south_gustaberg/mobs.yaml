    display_name:  Huge_Hornet
    species:       yellow_bee
    skill_list_id: 48
    attributes:
      combat:
        skill: dagger
      jobs: [war, war]
      render:
        look:
          type:  standard
          model: 272
        entity_flags:  129
        animation_sub: 8
        hitbox:        8

