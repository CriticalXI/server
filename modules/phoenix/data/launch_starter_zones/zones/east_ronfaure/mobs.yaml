      combat:
        skill: scythe
      jobs: [war, war]
      render:
        look:
          type:  standard
          model: 268
        entity_flags: 129
        hitbox:       11

  Forest_Funguar:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: sleepshroom
      steal: sleepshroom
      despoil:
        woozyshroom:       0
        sleepshroom:       0
        danceshroom:       0
        agaricus_mushroom: 0

  Forest_Hare:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: slice_of_hare_meat
        - chance: rare
          item: rabbit_hide
      steal: san_dorian_carrot
      despoil:
        rabbit_hide:        0
        slice_of_hare_meat: 0

  Scarab_Beetle:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: rare
          item: insect_wing
        - chance: super_rare
          item: beetle_jaw
      despoil:
        insect_wing:  0
        beetle_shell: 0
        beetle_jaw:   0

  Tunnel_Worm:
    attributes:
      spawn:
        respawn: 0 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: flint_stone
      steal: pebble
      despoil:
        chunk_of_copper_ore: 0
        chunk_of_iron_ore:   0
        chunk_of_silver_ore: 0
        chunk_of_zinc_ore:   0

  Wild_Rabbit:
    attributes:
      spawn:
        respawn: 0 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: rabbit_hide
        - chance: rare
          item: rabbit_hide
      steal: san_dorian_carrot
      despoil:
        rabbit_hide:        0
        slice_of_hare_meat: 0

  Wild_Sheep:
    attributes:
      spawn:
        respawn: 60 # Launch starter zones
    loot: # Launch starter zones
      drops:
        - chance: uncommon
          item: slice_of_giant_sheep_meat
        - chance: very_rare
          item: sheep_tooth
        - chance: rare
          item: sheepskin
      steal: clump_of_sheep_wool
      despoil:
        sheep_tooth: 50

